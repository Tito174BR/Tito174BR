      <rect x="190" y="98" width="630" height="14" rx="7" fill="#21262D"/>
      <rect x="190" y="98" width="315.0" height="14" rx="7" fill="#FC6D26"/>
      <text x="840" y="110" class="small" text-anchor="end">50.0%</text>
